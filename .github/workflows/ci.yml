name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: make verify
      - name: Verify PostgreSQL lifecycle
        run: make verify-postgres
      - name: Verify candidate extraction
        run: make verify-extraction
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down --volumes
