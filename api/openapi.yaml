openapi: 3.1.0
info:
  title: Go Agent Memory System API
  version: 0.3.0
  description: >-
    Durable-storage API backed by PostgreSQL. X-Tenant-ID and X-User-ID select
    a scope but are not authentication credentials. Request bodies are capped
    at 65536 bytes; x-max-bytes documents UTF-8 byte limits enforced by the
    server. Automatic extraction converts persisted same-scope evidence into
    pending candidates; it never approves or exposes them through retrieval.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: health
      description: Process liveness only; this endpoint does not query PostgreSQL.
      responses:
        "200":
          description: The HTTP process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readiness
      description: >-
        Queries PostgreSQL and, for an explicitly configured dense or hybrid
        mode, verifies the serving-space pin and embedding public probe. This
        endpoint does not probe the optional candidate extractor.
      responses:
        "200":
          description: All dependencies for the configured retrieval mode are reachable and match the serving pin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: PostgreSQL or a configured dense/hybrid dependency is unavailable, mismatched, or timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
  /v1/evidence:
    post:
      operationId: appendEvidence
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendEvidenceRequest"
      responses:
        "201":
          description: Evidence appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceEvent"
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/memory-candidate-extractions:
    post:
      operationId: extractMemoryCandidates
      description: >-
        Loads 1 to 20 persisted evidence events from the caller's tenant/user
        scope, invokes the process-configured structured extractor, validates
        the complete untrusted result, and atomically creates zero to ten
        pending candidates. Loaded evidence content is capped at 65536 bytes
        in total. Every candidate support must cite one requested event and
        contain a quote of at most 1024 bytes that occurs verbatim in that
        event. Exact quote containment proves mechanical traceability, not
        semantic entailment. Only the separate explicit review operation can
        make a candidate retrievable.
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractCandidatesRequest"
      responses:
        "200":
          description: Extraction completed; candidates may be empty and are always pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractCandidatesResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "502": {$ref: "#/components/responses/ExtractionBadGateway"}
        "503": {$ref: "#/components/responses/ExtractionUnavailable"}
        "504": {$ref: "#/components/responses/RequestTimeout"}
  /v1/memory-candidates:
    post:
      operationId: proposeMemoryCandidate
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeCandidateRequest"
      responses:
        "201":
          description: Pending candidate created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryCandidate"
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /v1/memory-candidates/{candidate_id}/reviews:
    post:
      operationId: reviewMemoryCandidate
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/UserID"
        - name: candidate_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCandidateRequest"
      responses:
        "200":
          description: Candidate reviewed; memory is present only after approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCandidateResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /v1/context-packs:
    post:
      operationId: buildContextPack
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildContextRequest"
      responses:
        "200":
          description: Ranked active memories with source evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextPack"
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/RetrievalUnavailable"}
        "504": {$ref: "#/components/responses/RequestTimeout"}
  /v1/users/{user_id}:
    delete:
      operationId: forgetUser
      description: >-
        Transactionally removes persisted evidence, candidates, and memory cards
        for one tenant/user scope.
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: user_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Deletion receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionReceipt"
        "400": {$ref: "#/components/responses/BadRequest"}
components:
  parameters:
    TenantID:
      name: X-Tenant-ID
      in: header
      required: true
      schema: {type: string, x-max-bytes: 128}
    UserID:
      name: X-User-ID
      in: header
      required: true
      schema: {type: string, x-max-bytes: 128}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Resource not found in the caller scope
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Duplicate identifier or invalid lifecycle transition
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RetrievalUnavailable:
      description: The configured dense or hybrid retrieval dependency is unavailable
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ExtractionBadGateway:
      description: >-
        The configured extractor explicitly rejected the request or returned a
        response that failed the strict structured-output contract. The fixed
        error code is extraction_rejected or invalid_extractor_output.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ExtractionUnavailable:
      description: >-
        Candidate extraction is disabled or its configured provider is
        temporarily unavailable. The fixed error code is extraction_disabled
        or extraction_unavailable.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RequestTimeout:
      description: The requested retrieval or extraction did not complete before its deadline
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, phase, storage]
      properties:
        status: {type: string, const: ok}
        phase: {type: string, enum: [postgres-fts, postgres-dense, postgres-hybrid-rrf]}
        storage: {type: string, const: postgresql}
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status, storage]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        storage: {type: string, const: postgresql}
    AppendEvidenceRequest:
      type: object
      additionalProperties: false
      required: [session_id, actor, content]
      properties:
        event_id: {type: string, x-max-bytes: 128}
        session_id: {type: string, x-max-bytes: 128}
        actor: {type: string, enum: [user, agent, tool]}
        content: {type: string, x-max-bytes: 32768}
        metadata:
          type: object
          additionalProperties: {type: string, x-max-bytes: 1024}
          maxProperties: 32
        occurred_at: {type: string, format: date-time}
    ExtractCandidatesRequest:
      type: object
      additionalProperties: false
      required: [source_event_ids]
      properties:
        source_event_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {type: string, x-max-bytes: 128}
    ProposeCandidateRequest:
      type: object
      additionalProperties: false
      required: [kind, category, key, value, source_event_ids, extractor, extractor_version]
      properties:
        kind: {type: string, enum: [episodic, semantic, procedural]}
        category: {type: string, x-max-bytes: 128}
        key: {type: string, x-max-bytes: 128}
        value: {type: string, x-max-bytes: 4096}
        person: {type: string, x-max-bytes: 256}
        relationship: {type: string, x-max-bytes: 256}
        backstory: {type: string, x-max-bytes: 2048}
        source_event_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string}
        extractor: {type: string, x-max-bytes: 128}
        extractor_version: {type: string, x-max-bytes: 128}
        expires_at: {type: string, format: date-time}
        metadata:
          type: object
          additionalProperties: {type: string, x-max-bytes: 1024}
          maxProperties: 32
    ReviewCandidateRequest:
      type: object
      additionalProperties: false
      required: [decision, reviewer_id, reason]
      properties:
        decision: {type: string, enum: [approve, reject]}
        reviewer_id: {type: string, x-max-bytes: 128}
        reason: {type: string, x-max-bytes: 2048}
    BuildContextRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: {type: string, x-max-bytes: 4096}
        limit: {type: integer, minimum: 1, maximum: 20, default: 5}
    EvidenceEvent:
      type: object
      required: [id, tenant_id, user_id, session_id, actor, content, occurred_at, recorded_at]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        user_id: {type: string}
        session_id: {type: string}
        actor: {type: string, enum: [user, agent, tool]}
        content: {type: string}
        metadata:
          type: object
          additionalProperties: {type: string}
        occurred_at: {type: string, format: date-time}
        recorded_at: {type: string, format: date-time}
    CandidateReview:
      type: object
      required: [decision, reviewer_id, reason, reviewed_at]
      properties:
        decision: {type: string, enum: [approve, reject]}
        reviewer_id: {type: string}
        reason: {type: string}
        reviewed_at: {type: string, format: date-time}
    MemoryCandidate:
      type: object
      required: [id, tenant_id, user_id, kind, category, key, value, source_event_ids, extractor, extractor_version, status, created_at]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        user_id: {type: string}
        kind: {type: string, enum: [episodic, semantic, procedural]}
        category: {type: string}
        key: {type: string}
        value: {type: string}
        person: {type: string}
        relationship: {type: string}
        backstory: {type: string}
        source_event_ids:
          type: array
          items: {type: string}
        extractor: {type: string}
        extractor_version: {type: string}
        status: {type: string, enum: [pending, approved, rejected]}
        review: {$ref: "#/components/schemas/CandidateReview"}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        metadata:
          type: object
          additionalProperties: {type: string}
    ExtractorDescriptor:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: {type: string}
        version: {type: string}
    ExtractCandidatesResponse:
      type: object
      additionalProperties: false
      required: [extraction_id, source_event_ids, extractor, candidates]
      properties:
        extraction_id: {type: string}
        source_event_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {type: string}
        extractor: {$ref: "#/components/schemas/ExtractorDescriptor"}
        candidates:
          type: array
          minItems: 0
          maxItems: 10
          items:
            allOf:
              - $ref: "#/components/schemas/MemoryCandidate"
              - type: object
                properties:
                  status: {type: string, const: pending}
    MemoryCard:
      type: object
      required: [id, candidate_id, tenant_id, user_id, kind, category, key, value, source_event_ids, version, status, created_at]
      properties:
        id: {type: string}
        candidate_id: {type: string}
        tenant_id: {type: string}
        user_id: {type: string}
        kind: {type: string, enum: [episodic, semantic, procedural]}
        category: {type: string}
        key: {type: string}
        value: {type: string}
        person: {type: string}
        relationship: {type: string}
        backstory: {type: string}
        source_event_ids:
          type: array
          items: {type: string}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [active, superseded]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        superseded_at: {type: string, format: date-time}
    ReviewCandidateResponse:
      type: object
      required: [candidate]
      properties:
        candidate: {$ref: "#/components/schemas/MemoryCandidate"}
        memory: {$ref: "#/components/schemas/MemoryCard"}
    ContextItem:
      type: object
      required: [memory, score, sources]
      properties:
        memory: {$ref: "#/components/schemas/MemoryCard"}
        score: {type: number}
        sources:
          type: array
          items: {$ref: "#/components/schemas/EvidenceEvent"}
    ContextPack:
      type: object
      required: [tenant_id, user_id, query, items, generated_at]
      properties:
        tenant_id: {type: string}
        user_id: {type: string}
        query: {type: string}
        items:
          type: array
          items: {$ref: "#/components/schemas/ContextItem"}
        generated_at: {type: string, format: date-time}
    DeletionReceipt:
      type: object
      required: [tenant_id, user_id, evidence_deleted, candidates_deleted, memories_deleted, deleted_at]
      properties:
        tenant_id: {type: string}
        user_id: {type: string}
        evidence_deleted: {type: integer, minimum: 0}
        candidates_deleted: {type: integer, minimum: 0}
        memories_deleted: {type: integer, minimum: 0}
        deleted_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
